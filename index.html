<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bear Trap Planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#17130f; --bg-panel:#221c16; --bg-raised:#2b241c; --line:#3d3327;
    --ember:#d9540d; --ember-bright:#f2792c; --gold:#c9a227; --gold-bright:#e8bf3c;
    --steel:#7c8a94; --cav:#8a5a3c; --parchment:#ece3d3; --dim:#a89d8a;
    --danger:#b8402e; --ok:#6f9b52;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--parchment); font-family:'Inter',sans-serif; }
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(217,84,13,0.10), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(201,162,39,0.07), transparent 40%);
    min-height:100vh; padding:44px 16px 80px;
  }
  .wrap{ max-width:780px; margin:0 auto; }

  .banner{ text-align:center; margin-bottom:40px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  h1{ font-family:'Cinzel',serif; font-weight:900; font-size:clamp(30px,6vw,46px); margin:0 0 10px; text-shadow:0 0 30px rgba(217,84,13,0.35); }
  h1 span{ color:var(--ember-bright); }
  .sub{ color:var(--dim); font-size:15px; max-width:500px; margin:0 auto; line-height:1.5; }

  .panel{ background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; padding:26px 22px 24px; margin-bottom:22px; position:relative; }
  .panel[data-step]::before{
    content:attr(data-step); position:absolute; top:-12px; left:20px; background:var(--ember); color:#1a1310;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; padding:3px 10px; border-radius:3px; letter-spacing:1px;
  }
  .panel h2{ font-family:'Cinzel',serif; font-size:18px; font-weight:700; margin:4px 0 16px; color:var(--gold-bright); }
  .hint{ font-size:13px; color:var(--dim); line-height:1.55; margin:-6px 0 16px; }

  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .pill{
    flex:1; min-width:120px; background:var(--bg-raised); border:1px solid var(--line); color:var(--dim);
    padding:12px 14px; border-radius:5px; cursor:pointer; text-align:center; font-size:14px; font-weight:600;
    transition:border-color .15s,color .15s,background .15s; user-select:none; font-family:inherit;
  }
  .pill:hover{ border-color:var(--ember); color:var(--parchment); }
  .pill.active{ background:linear-gradient(180deg,rgba(217,84,13,0.22),rgba(217,84,13,0.08)); border-color:var(--ember-bright); color:var(--parchment); }
  .pill small{ display:block; font-weight:400; font-size:11.5px; color:var(--dim); margin-top:3px; }

  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:560px){ .grid3{ grid-template-columns:1fr; } }
  .field{ margin-bottom:16px; } .field:last-child{ margin-bottom:0; }
  label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin-bottom:7px; font-weight:600; }
  input[type=number]{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); color:var(--parchment);
    font-family:'JetBrains Mono',monospace; font-size:16px; padding:11px 13px; border-radius:5px; outline:none;
  }
  input[type=number]:focus{ border-color:var(--ember-bright); }
  .troop-label{ display:flex; align-items:center; gap:7px; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .sw-inf{ background:var(--steel); } .sw-cav{ background:var(--cav); } .sw-arc{ background:var(--gold); }
  .note{ font-size:11.5px; color:var(--dim); margin-top:6px; }

  input[type=range]{ width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--steel),var(--cav)); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--parchment); border:2px solid #1a1310; cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--parchment); border:2px solid #1a1310; cursor:pointer; }
  .split-top{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); margin-bottom:8px; }
  .split-top b{ color:var(--parchment); }

  /* ratio options */
  .empty{ text-align:center; color:var(--dim); font-size:14px; padding:18px 0 6px; }
  .opts{ display:grid; gap:10px; }
  .opt{
    display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:5px; padding:12px 14px; cursor:pointer;
    text-align:left; color:var(--parchment); font-family:inherit; width:100%;
  }
  .opt:hover{ border-color:var(--gold); }
  .opt.active{ border-color:var(--gold-bright); background:rgba(201,162,39,0.10); box-shadow:inset 0 0 0 1px rgba(232,191,60,0.25); }
  .opt .ratio{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; }
  .opt .tag{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; padding:2px 7px; border-radius:3px; margin-left:8px; vertical-align:2px; }
  .tag.rec{ background:var(--ember); color:#1a1310; }
  .opt .status{ font-size:12.5px; text-align:right; font-family:'JetBrains Mono',monospace; }
  .status.ok{ color:#a9c894; } .status.low{ color:var(--gold-bright); } .status.need{ color:#e0968a; }
  .opt .desc{ grid-column:1 / -1; font-size:12px; color:var(--dim); }
  .ratio-legend{ font-size:11.5px; color:var(--dim); margin-bottom:10px; font-family:'JetBrains Mono',monospace; }

  /* results */
  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  @media (max-width:520px){ .summary{ grid-template-columns:1fr; } }
  .stat{ background:var(--bg-raised); border:1px solid var(--line); border-radius:5px; padding:12px; text-align:center; }
  .stat .n{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--gold-bright); }
  .stat .l{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-top:4px; }

  .msg{ border-radius:5px; padding:12px 15px; font-size:13.5px; margin-bottom:16px; border:1px solid; line-height:1.55; }
  .msg.ok{ background:rgba(111,155,82,0.10); border-color:rgba(111,155,82,0.4); color:#a9c894; }
  .msg.warn{ background:rgba(184,64,46,0.10); border-color:rgba(184,64,46,0.45); color:#e0968a; }
  .msg b{ color:var(--parchment); }

  .march{ background:var(--bg-raised); border:1px solid var(--line); border-radius:5px; padding:13px 15px; margin-bottom:10px; }
  .march.lead{ border-color:rgba(232,191,60,0.5); }
  .march .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; gap:10px; }
  .march .name{ font-family:'Cinzel',serif; font-weight:700; font-size:14px; }
  .march.lead .name{ color:var(--gold-bright); }
  .march .cap{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); white-space:nowrap; }
  .bar{ display:flex; height:18px; border-radius:3px; overflow:hidden; margin-bottom:9px; background:var(--bg); }
  .bar div{ height:100%; }
  .b-inf{ background:var(--steel); } .b-cav{ background:var(--cav); } .b-arc{ background:var(--gold); }
  .breakdown{ display:flex; gap:16px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--dim); }
  .breakdown b{ color:var(--parchment); }

  .copy{
    width:100%; margin-top:8px; background:transparent; border:1px solid var(--line); color:var(--parchment);
    font-family:'JetBrains Mono',monospace; font-size:13px; padding:11px; border-radius:5px; cursor:pointer;
  }
  .copy:hover{ border-color:var(--gold); }

  .gens .pill{ min-width:120px; flex:1 1 calc(25% - 10px); padding:11px 8px; font-family:'JetBrains Mono',monospace; }
  .tag.alt{ background:var(--steel); color:#1a1310; }
  .opt .ratio{ white-space:nowrap; }
  @media (max-width:560px){ .opt{ grid-template-columns:1fr; } .opt .status{ text-align:left; } }
  .lang{ display:flex; justify-content:center; gap:6px; margin-bottom:22px; }
  .lang button{ background:var(--bg-raised); border:1px solid var(--line); color:var(--dim); font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; padding:6px 11px; border-radius:4px; cursor:pointer; letter-spacing:1px; }
  .lang button:hover{ border-color:var(--gold); color:var(--parchment); }
  .lang button.active{ border-color:var(--gold-bright); color:var(--gold-bright); background:rgba(201,162,39,0.10); }
  .fixed{ background:var(--bg-raised); border:1px dashed var(--line); color:var(--gold-bright); font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; padding:11px 13px; border-radius:5px; }
  .march .lead-note{ font-size:12.5px; color:var(--dim); line-height:1.5; margin:0 0 9px; }
  .calc{ display:inline-block; margin-top:11px; color:var(--gold-bright); font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid rgba(232,191,60,0.45); padding:7px 11px; border-radius:4px; }
  .calc:hover{ background:rgba(201,162,39,0.12); }
  /* Arabic / RTL */
  html[lang=ar] body, html[lang=ar] h1, html[lang=ar] h2, html[lang=ar] .march .name, html[lang=ar] .opt, html[lang=ar] .copy, html[lang=ar] .calc, html[lang=ar] .ratio-legend, html[lang=ar] .status{ font-family:'Noto Sans Arabic','Inter',sans-serif; }
  html[lang=ar] *{ letter-spacing:0 !important; }
  html[dir=rtl] .panel[data-step]::before{ left:auto; right:20px; }
  html[dir=rtl] .opt{ text-align:right; } html[dir=rtl] .opt .status{ text-align:left; }
  .ratio, .gens .pill, #sRatio, .cap, .fixed, input[type=number], bdi{ direction:ltr; unicode-bidi:isolate; }
  html[dir=rtl] .fixed, html[dir=rtl] input[type=number]{ text-align:right; }
  .frak.grid3{ grid-template-columns:repeat(3,1fr); gap:10px; }
  label.mini{ font-size:11px; letter-spacing:.6px; }
  .frak-err{ color:#e0968a; }
  .footnote{ text-align:center; font-size:12px; color:var(--dim); margin-top:28px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">

  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="es">ES</button><button data-lang="pt">PT</button><button data-lang="ar">AR</button>
  </div>

  <div class="banner">
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
  </div>

  <!-- 01 TROOPS -->
  <div class="panel" data-step="01">
    <h2 data-i="s1"></h2>
    <p class="hint" data-i="t10"></p>
    <div class="grid3">
      <div class="field">
        <label for="inf"><span class="troop-label"><span class="swatch sw-inf"></span><span data-i="inf"></span></span></label>
        <input type="number" id="inf" min="0" step="1000" data-ph="200000">
      </div>
      <div class="field">
        <label for="cav"><span class="troop-label"><span class="swatch sw-cav"></span><span data-i="cav"></span></span></label>
        <input type="number" id="cav" min="0" step="1000" data-ph="150000">
      </div>
      <div class="field">
        <label for="arc"><span class="troop-label"><span class="swatch sw-arc"></span><span data-i="arc"></span></span></label>
        <input type="number" id="arc" min="0" step="1000" data-ph="400000">
      </div>
    </div>
  </div>

  <!-- 02 RALLY + MARCHES -->
  <div class="panel" data-step="02">
    <h2 data-i="s2"></h2>
    <div class="field">
      <label data-i="leadQ"></label>
      <div class="row">
        <button class="pill active" data-rally="no"><span data-i="no"></span><small data-i="noSub"></small></button>
        <button class="pill" data-rally="yes"><span data-i="yes"></span><small data-i="yesSub"></small></button>
      </div>
    </div>
    <div id="frakFields" style="display:none;">
      <div class="field">
        <label data-i="frakL"></label>
        <div class="grid3 frak">
          <div><label for="fInf" class="mini"><span class="troop-label"><span class="swatch sw-inf"></span><span data-i="inf"></span> %</span></label><input type="number" id="fInf" min="0" max="100" step="0.1" placeholder="%"></div>
          <div><label for="fCav" class="mini"><span class="troop-label"><span class="swatch sw-cav"></span><span data-i="cav"></span> %</span></label><input type="number" id="fCav" min="0" max="100" step="0.1" placeholder="%"></div>
          <div><label for="fArc" class="mini"><span class="troop-label"><span class="swatch sw-arc"></span><span data-i="arc"></span> %</span></label><input type="number" id="fArc" min="0" max="100" step="0.1" placeholder="%"></div>
        </div>
        <div class="note" data-i="frakNote"></div>
        <div class="note frak-err" id="frakErr"></div>
      </div>
      <div class="field">
        <label for="rallySize" data-i="rallySizeL"></label>
        <input type="number" id="rallySize" min="0" step="1000">
        <div class="note" data-i="rallySizeNote"></div>
      </div>
    </div>
    <div class="field">
      <label data-i="marchQ"></label>
      <div class="row">
        <button class="pill" data-marches="4">4</button>
        <button class="pill active" data-marches="5">5</button>
        <button class="pill" data-marches="6">6</button>
      </div>
      <div class="note" id="marchNote"></div>
    </div>
    <div class="field">
      <label data-i="capL"></label>
      <div class="fixed" id="capVal">90,000</div>
      <div class="note" data-i="capNote"></div>
    </div>
  </div>

  <!-- 03 RATIO -->
  <div class="panel" data-step="03">
    <h2 data-i="s3"></h2>
    <p class="hint" data-i="hint"></p>
    <div class="field">
      <label data-i="targetL"></label>
      <div class="row gens">
        <button class="pill" data-gen="r60">10 / 30 / 60</button>
        <button class="pill" data-gen="r70">10 / 20 / 70</button>
        <button class="pill active" data-gen="r80">10 / 10 / 80</button>
        <button class="pill" data-gen="r89">1 / 10 / 89</button>
      </div>
    </div>
    <div id="ratioBox"></div>
  </div>

  <!-- 04 MANIFEST -->
  <div class="panel" data-step="04" id="results" style="display:none;">
    <h2 data-i="s4"></h2>
    <div id="status"></div>
    <div class="summary">
      <div class="stat"><div class="n" id="sRatio">–</div><div class="l" id="statRatio"></div></div>
      <div class="stat"><div class="n" id="sMarch">–</div><div class="l" data-i="statPer"></div></div>
      <div class="stat"><div class="n" id="sTotal">–</div><div class="l" data-i="statTotal"></div></div>
    </div>
    <div id="marchList"></div>
    <button class="copy" id="copyBtn" data-i="copy"></button>
  </div>

  <p class="footnote" data-i="footnote"></p>
</div>

  let lang = (() => {
    try { const s = localStorage.getItem('btp-lang'); if (I18N[s]) return s; } catch (e) {}
    const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return I18N[n] ? n : 'en';
  })();
  const L = () => I18N[lang];
  const T = (k, v = {}) => (L()[k] ?? I18N.en[k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString(L().locale);
  const num = id => Math.max(0, Math.floor(parseFloat($(id).value) || 0));

  function applyLang(){
    document.documentElement.lang = L().html;
    document.documentElement.dir = L().dir || 'ltr';
    document.title = L().docTitle;
    document.querySelectorAll('[data-i]').forEach(el => el.innerHTML = T(el.dataset.i));
    document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = `${T('eg')} ${Number(el.dataset.ph).toLocaleString(L().locale)}`);
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    $('statRatio').textContent = `${T('infS')} / ${T('cavS')} / ${T('arcS')}`;
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('btp-lang', lang); } catch (e) {}
    applyLang(); update();
  });

  const RATIOS = {
    r60:{ inf:10, cav:30, arc:60 },
    r70:{ inf:10, cav:20, arc:70 },
    r80:{ inf:10, cav:10, arc:80 },
    r89:{ inf:1,  cav:10, arc:89 },
  };
  const ORDER = ['r60','r70','r80','r89'];

  const CAP = 90000; // max join march size — fixed
  const CALC_URL = 'https://frakinator.streamlit.app/';
  const state = { rally:false, marches:5, gen:'r80', pick:null };

  // ---------- controls ----------
  function group(attr, fn){
    document.querySelectorAll(`[data-${attr}]`).forEach(el => el.onclick = () => {
      document.querySelectorAll(`[data-${attr}]`).forEach(p => p.classList.toggle('active', p === el));
      fn(el.dataset[attr]); update();
    });
  }
  group('rally', v => state.rally = v === 'yes');
  group('marches', v => state.marches = +v);
  group('gen', v => { state.gen = v; state.pick = null; });
  ['inf','cav','arc'].forEach(id => $(id).addEventListener('input', () => { state.pick = null; update(); }));
  ['fInf','fCav','fArc','rallySize'].forEach(id => $(id).addEventListener('input', update));

  // ---------- core math ----------
  function atRatio(size, r){
    const arc = Math.floor(size * r.arc / 100);
    const cav = Math.floor(size * r.cav / 100);
    return { inf: size - arc - cav, cav, arc };
  }

  // Closest thing to ratio r that your stock can fill in n marches of up to `cap`.
  function bestFit(cap, r, t, n){
    const total = t.inf + t.cav + t.arc;
    const size = Math.min(cap, Math.floor(total / n));
    const tgt = atRatio(size, r);
    const per = { inf:Math.floor(t.inf / n), cav:Math.floor(t.cav / n), arc:Math.floor(t.arc / n) };
    const m = { inf:Math.min(tgt.inf, per.inf), cav:Math.min(tgt.cav, per.cav), arc:Math.min(tgt.arc, per.arc) };
    let gap = size - m.inf - m.cav - m.arc;
    for (const k of ['arc','cav','inf']){
      const add = Math.min(gap, per[k] - m[k]); m[k] += add; gap -= add;
    }
    return m;
  }

  const sum = m => m.inf + m.cav + m.arc;
  const pctStr = m => { const s = sum(m) || 1, f = x => (+(x / s * 100).toFixed(1)).toLocaleString(L().locale); return `${f(m.inf)} / ${f(m.cav)} / ${f(m.arc)}`; };
  const shortOf = (m, t, n) => ({ inf:Math.max(0, m.inf*n - t.inf), cav:Math.max(0, m.cav*n - t.cav), arc:Math.max(0, m.arc*n - t.arc) });
  const shortTxt = s => [s.arc && T('plusArc', {n:fmt(s.arc)}), s.cav && T('plusCav', {n:fmt(s.cav)}), s.inf && T('plusInf', {n:fmt(s.inf)})].filter(Boolean);
  const minus = (a, b, n = 1) => ({ inf:Math.max(0, a.inf - b.inf*n), cav:Math.max(0, a.cav - b.cav*n), arc:Math.max(0, a.arc - b.arc*n) });

  // Join marches are always filled first; whatever is left goes to your own rally.
  function plan(r, t, joins, fitJoins){
    const m = fitJoins ? bestFit(CAP, r, t, joins) : atRatio(CAP, r);
    const short = shortOf(m, t, joins);
    const ok = !shortTxt(short).length;
    const left = minus(t, m, joins);
    return { m, short, ok, left, t };
  }

  // Frakinator ratio for your own rally: null = not set, {bad:sum} = doesn't add up, else {inf,cav,arc}.
  function frakRatio(){
    const v = ['fInf','fCav','fArc'].map(id => $(id).value.trim());
    if (v.every(x => x === '')) return null;
    const [inf, cav, arc] = v.map(x => Math.max(0, parseFloat(x) || 0));
    const s = inf + cav + arc;
    if (Math.abs(s - 100) > 0.5) return { bad:+s.toFixed(1) };
    return { inf:inf / s * 100, cav:cav / s * 100, arc:arc / s * 100 };
  }
  // Biggest rally march at exactly ratio r that `left` can fill, capped at `cap` if given.
  function rallyAt(r, left, cap){
    let size = Infinity;
    for (const k of ['inf','cav','arc']) if (r[k] > 0) size = Math.min(size, Math.floor(left[k] / (r[k] / 100)));
    if (!isFinite(size)) size = 0;
    if (cap) size = Math.min(size, cap);
    let m = atRatio(size, r);
    // rounding guard: never use more than you have
    while (size > 0 && (m.inf > left.inf || m.cav > left.cav || m.arc > left.arc)){ size--; m = atRatio(size, r); }
    return m;
  }
  const rStr = r => `${+r.inf.toFixed(1)} / ${+r.cav.toFixed(1)} / ${+r.arc.toFixed(1)}`;

  function update(){
    const t = { inf:num('inf'), cav:num('cav'), arc:num('arc') };
    $('frakFields').style.display = state.rally ? 'block' : 'none';
    const fr = frakRatio();
    $('frakErr').textContent = fr && fr.bad !== undefined ? T('frakSum', {s:fr.bad}) : '';
    const n = state.marches;
    const joins = n; // lead rally is an extra march on top
    const genKey = state.gen;

    $('capVal').textContent = fmt(CAP);
    $('marchNote').textContent = state.rally ? T('marchNoteRally', {j:joins}) : T('marchNoteJoin', {n});

    if (!sum(t)){
      $('ratioBox').innerHTML = `<div class="empty">${T('empty')}</div>`;
      $('results').style.display = 'none';
      return;
    }

    const options = ORDER.map(k => {
      const r = RATIOS[k];
      return { key:k, r, p:plan(r, t, joins, false), isGen:k === genKey, label:`${r.inf} / ${r.cav} / ${r.arc}` };
    });
    const genOpt = options.find(o => o.isGen);

    let fit = null;
    if (!genOpt.p.ok){
      const p = plan(genOpt.r, t, joins, true);
      fit = { key:'fit', r:genOpt.r, p, label:pctStr(p.m), fit:true };
    }
    const all = fit ? [fit, ...options] : options;
    if (!all.some(o => o.key === state.pick)) state.pick = fit ? 'fit' : genKey;

    const keep = () => '';
    let html = `<div class="ratio-legend">${T('legend')}</div><div class="opts">`;
    all.forEach(o => {
      const m = o.p.m;
      let tag = '', desc;
      if (o.fit){
        tag = `<span class="tag rec">${T('tagFit')}</span>`;
        desc = sum(m) < CAP
          ? T('fitUnder', {size:fmt(sum(m)), after:keep(m)})
          : T('fitFull', {j:joins, cap:fmt(CAP), after:keep(m)});
      } else {
        if (o.isGen) tag = `<span class="tag ${o.p.ok ? 'rec' : 'alt'}">${T('tagTarget')}</span>`;
        desc = T('needDesc', {arc:fmt(m.arc*joins), cav:fmt(m.cav*joins), inf:fmt(m.inf*joins), j:joins, cap:fmt(CAP), after:keep(m)});
      }
      const fOk = frakRatio(); const low = state.rally && o.p.ok && !(fOk && fOk.bad === undefined) && o.p.left.arc < m.arc;
      const status = low ? `<span class="status low">${T('canFillLow')}</span>`
                   : o.p.ok ? `<span class="status ok">${T('canFill')}</span>`
                            : `<span class="status need">${T('need', {list:shortTxt(o.p.short).join(', ')})}</span>`;
      html += `<button class="opt ${state.pick === o.key ? 'active' : ''}" data-k="${o.key}">
        <span class="ratio">${o.label}${tag}</span>${status}<span class="desc">${desc}</span></button>`;
    });
    html += '</div>';
    $('ratioBox').innerHTML = html;
    document.querySelectorAll('.opt').forEach(el => el.onclick = () => { state.pick = el.dataset.k; update(); });

    renderManifest(all.find(o => o.key === state.pick), joins);
  }

  function renderManifest(o, joins){
    const p = o.p, m = p.m, per = sum(m);
    const fr0 = frakRatio(), fr = fr0 && fr0.bad === undefined ? fr0 : null;
    const rallyCap = num('rallySize');
    // remaining troops for your own rally — at the Frakinator ratio if one is set
    const lead = state.rally && p.ok ? (fr ? rallyAt(fr, p.left, rallyCap) : p.left) : null;
    const after = lead ? minus(p.left, lead) : p.left;
    const capShort = fr && lead && rallyCap && sum(lead) < rallyCap ? shortTxt(shortOf(atRatio(rallyCap, fr), p.left, 1)) : [];
    const arcWarn = !fr && lead && lead.arc < m.arc
      ? `<div class="msg warn">⚠ ${T('arcWarn', {have:fmt(lead.arc), join:fmt(m.arc), need:fmt(m.arc - lead.arc)})}</div>` : '';

    const msgs = [];
    if (!p.ok){
      msgs.push(`<div class="msg warn">${T('preview', {list:shortTxt(p.short).join(', '), j:joins, r:`<bdi>${o.label}</bdi>`})}</div>`);
    } else {
      const under = per < CAP ? T('under', {per:fmt(per), cap:fmt(CAP), more:fmt(CAP*joins - sum(p.t))}) : '';
      const off = o.fit ? T('off') : '';
      msgs.push(`<div class="msg ${per < CAP || o.fit ? 'warn' : 'ok'}">${T('joinsMsg', {how:T('joinsFirst'), off, under})}</div>`);
      if (arcWarn) msgs.push(arcWarn);
      if (!state.rally || fr) msgs.push(`<div class="msg ok" style="opacity:.85">${T('reserve', {inf:fmt(after.inf), cav:fmt(after.cav), arc:fmt(after.arc)})}</div>`);
    }
    $('status').innerHTML = msgs.join('');

    const ratio = pctStr(m).replace(/ /g, '');
    $('sRatio').textContent = ratio;
    $('sMarch').textContent = fmt(per);
    $('sTotal').textContent = fmt(per * joins + (lead ? sum(lead) : 0));

    const bar = (x, c) => `<div class="bar">
          <div class="b-inf" style="width:${c ? x.inf / c * 100 : 0}%"></div>
          <div class="b-cav" style="width:${c ? x.cav / c * 100 : 0}%"></div>
          <div class="b-arc" style="width:${c ? x.arc / c * 100 : 0}%"></div>
        </div>`;
    const breakdown = x => `<div class="breakdown">
          <span>${T('inf')} <b>${fmt(x.inf)}</b></span><span>${T('cav')} <b>${fmt(x.cav)}</b></span><span>${T('arc')} <b>${fmt(x.arc)}</b></span>
        </div>`;
    const card = (name, x, c) => `<div class="march">
        <div class="head"><span class="name">${name}</span><span class="cap">${fmt(sum(x))} / ${fmt(c)}</span></div>
        ${bar(x, c)}${breakdown(x)}
      </div>`;
    let html = '';
    for (let i = 0; i < joins; i++) html += card(T('joinName', {i:i + 1}), m, CAP);
    if (state.rally){
      const x = lead || { inf:0, cav:0, arc:0 };
      html += `<div class="march lead">
        <div class="head"><span class="name">${T('leadName')}</span><span class="cap">${fmt(sum(x))}${fr && rallyCap ? ' / ' + fmt(rallyCap) : ''}</span></div>
        <p class="lead-note">${!lead ? T('leadEmpty') : fr ? T('leadFrak', {r:`<bdi>${rStr(fr)}</bdi>`}) : T('leadRemain')}</p>
        ${lead ? bar(x, sum(x)) + breakdown(x) : ''}
        ${capShort.length ? `<div class="msg warn" style="margin:11px 0 0">${T('leadShortCap', {cap:fmt(rallyCap), list:capShort.join(', ')})}</div>` : ''}
        ${arcWarn ? arcWarn.replace('msg warn', 'msg warn" style="margin:11px 0 0') : ''}
        <a class="calc" href="${CALC_URL}" target="_blank" rel="noopener noreferrer">${T('calcLink')}</a>
      </div>`;
    }
    $('marchList').innerHTML = html;

    const line = x => `${T('infS')} ${fmt(x.inf)} | ${T('cavS')} ${fmt(x.cav)} | ${T('arcS')} ${fmt(x.arc)} = ${fmt(sum(x))}`;
    const text = [
      T('copyHead', {j:joins, plus:state.rally ? T('copyPlus') : ''}),
      T('copyEach', {r:ratio}) + line(m),
      lead ? (fr ? T('copyLeadFrak', {r:rStr(fr)}) : T('copyLead')) + line(lead) : '',
      state.rally ? T('copyCalc') + CALC_URL : '',
    ].filter(Boolean).join('\n');
    $('copyBtn').onclick = () => {
      const done = () => { $('copyBtn').textContent = T('copied'); setTimeout(() => $('copyBtn').textContent = T('copy'), 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(() => prompt('', text));
      else prompt('', text);
    };
    $('results').style.display = 'block';
  }

  applyLang();
  update();
</script>
</body>
</html>
